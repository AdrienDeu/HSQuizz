name: Deploy App (Frontend + Backend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          
          # --- CORRECTIF GIT (AJOUTÉ ICI) ---
          # On autorise Git à utiliser ce dossier même s'il appartient à www-data
          git config --global --add safe.directory /var/www/HSQuizz

          echo "🚀 DÉBUT DU DÉPLOIEMENT..."

          # --- 1. MISE A JOUR DU CODE ---
          cd /var/www/HSQuizz
          echo "📥 Récupération du code depuis GitHub..."
          git checkout main
          git fetch --all
          
          # ⚠️ ATTENTION : Cela va écraser votre server.js du serveur !
          # Assurez-vous d'avoir mis le bon server.js sur votre GitHub avant !
          git reset --hard origin/main

          # --- 2. FRONTEND (Angular) ---
          echo "🅰️  Mise à jour du Frontend..."
          cd frontend
          echo "📦 Installation des dépendances Frontend..."
          npm ci
          echo "🏗️  Build de l'application Angular..."
          npm run build -- --configuration production

          # --- 3. BACKEND (Node.js) ---
          echo "🔙 Mise à jour du Backend..."
          cd ../backend
          
          echo "📦 Installation des dépendances Backend..."
          npm install --production

          echo "🔄 Redémarrage du serveur Node.js..."
          pm2 restart hs-backend

          echo "✅ DÉPLOIEMENT TERMINÉ AVEC SUCCÈS ! 🎉"