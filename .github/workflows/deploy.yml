name: Deploy App (Frontend + Backend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          echo "🚀 DÉBUT DU DÉPLOIEMENT..."

          # --- 1. MISE A JOUR DU CODE (Frontend ET Backend) ---
          cd /var/www/HSQuizz
          echo "📥 Récupération du code depuis GitHub..."
          git checkout main
          git fetch --all
          # Attention : Ceci écrase toute modification faite à la main sur le serveur !
          git reset --hard origin/main

          # --- 2. FRONTEND (Angular) ---
          echo "🅰️  Mise à jour du Frontend..."
          cd frontend
          echo "📦 Installation des dépendances Frontend..."
          npm ci
          echo "🏗️  Build de l'application Angular..."
          npm run build -- --configuration production

          # --- 3. BACKEND (Node.js) ---
          echo "🔙 Mise à jour du Backend..."
          # On remonte d'un cran (..) et on va dans backend
          cd ../backend
          
          echo "📦 Installation des dépendances Backend..."
          npm install --production

          echo "🔄 Redémarrage du serveur Node.js..."
          # On redémarre le processus PM2 qu'on a créé ensemble
          pm2 restart hs-backend

          echo "✅ DÉPLOIEMENT TERMINÉ AVEC SUCCÈS ! 🎉"