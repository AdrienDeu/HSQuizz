<div class="leaderboard-container">
  <!-- Header -->
  <div class="leaderboard-header">
    <h1>Leaderboard</h1>
    <p class="subtitle">Top Hearthstone players</p>
  </div>

  <!-- Filtres -->
  <div class="filters-section">
    <div class="filter-group">
      <label for="region-select">Region</label>
      <select 
        id="region-select" 
        [(ngModel)]="selectedRegion" 
        (change)="onRegionChange()"
        class="filter-select"
      >
        <option *ngFor="let region of regions" [value]="region">
          {{ regionLabels[region] }}
        </option>
      </select>
    </div>

    <div class="filter-group">
      <label for="gamemode-select">Game Mode</label>
      <select 
        id="gamemode-select" 
        [(ngModel)]="selectedGameMode" 
        (change)="onGameModeChange()"
        class="filter-select"
      >
        <option *ngFor="let mode of gameModes" [value]="mode">
          {{ gameModeLabels[mode] }}
        </option>
      </select>
    </div>
  </div>

  <!-- Loading initial -->
  <div *ngIf="loading && leaderboardEntries.length === 0" class="loading">
    <div class="spinner"></div>
    <p>Loading leaderboard...</p>
  </div>

  <!-- Error -->
  <div *ngIf="error && !loading && leaderboardEntries.length === 0" class="error-message">
    <p>{{ error }}</p>
    <button class="btn btn-primary" (click)="loadLeaderboardPage(currentPage)">
      Retry
    </button>
  </div>

  <!-- Leaderboard Table -->
  <div *ngIf="leaderboardEntries.length > 0 || (loading && leaderboardEntries.length > 0)" class="leaderboard-content">
    <!-- Info en haut -->
    <div class="pagination-info top">
      <p>Players {{ getDisplayedRange() }} </p>
    </div>

    <div class="table-container">
      <!-- Loading overlay for table -->
      <div *ngIf="loading" class="table-loading-overlay">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>

      <table class="leaderboard-table" [class.loading-table]="loading">
        <thead>
          <tr>
            <th class="rank-col">Rank</th>
            <th class="player-col">Player</th>
            <th *ngIf="selectedGameMode === 'battlegrounds' || selectedGameMode === 'battlegroundsduo'" class="rating-col">Rating</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let entry of leaderboardEntries"
            [class]="getMedalClass(entry.rank)"
          >
            <td class="rank-cell">
              <span class="medal" *ngIf="entry.rank <= 3">{{ getMedalEmoji(entry.rank) }}</span>
              <span class="rank-number">{{ entry.rank }}</span>
            </td>
            <td class="player-cell">{{ entry.accountid }}</td>
            <td *ngIf="selectedGameMode === 'battlegrounds' || selectedGameMode === 'battlegroundsduo'" class="rating-cell">
              {{ entry.rating || '-' }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination complète en bas -->
    <div class="pagination-section bottom">
      <div class="pagination-controls">
        <button
          class="pagination-btn"
          (click)="previousPage()"
          [disabled]="currentPage === 1 || loading"
          title="Previous page"
        >
          ◀ Previous
        </button>



        <button
          class="pagination-btn"
          (click)="nextPage()"
          [disabled]="currentPage === totalPages || loading"
          title="Next page"
        >
          Next ▶
        </button>
      </div>


    </div>
  </div>
</div>
