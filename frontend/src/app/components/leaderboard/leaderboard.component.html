<div class="leaderboard-container">
  <!-- Header -->
  <div class="leaderboard-header">
    <h1>🏆 Leaderboard</h1>
    <p class="subtitle">Top 200 des meilleurs joueurs Hearthstone</p>
  </div>

  <!-- Filtres -->
  <div class="filters-section">
    <div class="filter-group">
      <label for="region-select">Région</label>
      <select 
        id="region-select" 
        [(ngModel)]="selectedRegion" 
        (change)="onRegionChange()"
        class="filter-select"
      >
        <option *ngFor="let region of regions" [value]="region">
          {{ regionLabels[region] }}
        </option>
      </select>
    </div>

    <div class="filter-group">
      <label for="gamemode-select">Mode de jeu</label>
      <select 
        id="gamemode-select" 
        [(ngModel)]="selectedGameMode" 
        (change)="onGameModeChange()"
        class="filter-select"
      >
        <option *ngFor="let mode of gameModes" [value]="mode">
          {{ gameModeLabels[mode] }}
        </option>
      </select>
    </div>
  </div>

  <!-- Loading initial -->
  <div *ngIf="loading && leaderboardEntries.length === 0" class="loading">
    <div class="spinner"></div>
    <p>Chargement du leaderboard...</p>
  </div>

  <!-- Error -->
  <div *ngIf="error && !loading && leaderboardEntries.length === 0" class="error-message">
    <p>{{ error }}</p>
    <button class="btn btn-primary" (click)="loadLeaderboardPage(currentPage)">
      Réessayer
    </button>
  </div>

  <!-- Leaderboard Table -->
  <div *ngIf="leaderboardEntries.length > 0 || (loading && leaderboardEntries.length > 0)" class="leaderboard-content">
    <!-- Info en haut -->
    <div class="pagination-info top">
      <p>Joueurs {{ getDisplayedRange() }} sur {{ totalEntries }}</p>
    </div>

    <div class="table-container">
      <!-- Loading overlay pour le tableau -->
      <div *ngIf="loading" class="table-loading-overlay">
        <div class="spinner"></div>
        <p>Chargement...</p>
      </div>

      <table class="leaderboard-table" [class.loading-table]="loading">
        <thead>
          <tr>
            <th class="rank-col">Rang</th>
            <th class="player-col">Joueur</th>
            <th *ngIf="selectedGameMode === 'battlegrounds' || selectedGameMode === 'battlegroundsduo'" class="rating-col">Rating</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let entry of leaderboardEntries"
            [class]="getMedalClass(entry.rank)"
          >
            <td class="rank-cell">
              <span class="medal" *ngIf="entry.rank <= 3">{{ getMedalEmoji(entry.rank) }}</span>
              <span class="rank-number">{{ entry.rank }}</span>
            </td>
            <td class="player-cell">{{ entry.accountid }}</td>
            <td *ngIf="selectedGameMode === 'battlegrounds' || selectedGameMode === 'battlegroundsduo'" class="rating-cell">
              {{ entry.rating || '-' }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination complète en bas -->
    <div class="pagination-section bottom">
      <div class="pagination-controls">
        <button
          class="pagination-btn"
          (click)="previousPage()"
          [disabled]="currentPage === 1 || loading"
          title="Page précédente"
        >
          ◀ Précédent
        </button>



        <button
          class="pagination-btn"
          (click)="nextPage()"
          [disabled]="currentPage === totalPages || loading"
          title="Page suivante"
        >
          Suivant ▶
        </button>
      </div>

      <!-- Navigation directe -->
      <div class="page-jump">
        <label for="page-input">Aller à la page :</label>
        <input
          id="page-input"
          type="number"
          #pageInput
          (keyup.enter)="goToPage(pageInput.valueAsNumber)"
          [disabled]="loading"
          min="1"
          [max]="totalPages"
          class="page-input"
        />
        <button class="btn btn-secondary" (click)="goToPage(pageInput.valueAsNumber)" [disabled]="loading">
          Aller
        </button>
      </div>
    </div>
  </div>
</div>
