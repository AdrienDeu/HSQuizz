name: Deploy App (Frontend + Backend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        command_timeout: 30m # ⚠️ IMPORTANT : Laisse 30min au serveur pour build (évite les coupures)
        script: |
          set -e
          
          # --- CONFIGURATION GIT ---
          # Évite l'erreur "dubious ownership" si l'utilisateur est différent
          git config --global --add safe.directory /var/www/HSQuizz

          echo "🚀 DÉBUT DU DÉPLOIEMENT..."

          # --- 1. MISE A JOUR DU CODE ---
          cd /var/www/HSQuizz
          echo "📥 Récupération du code depuis GitHub..."
          
          # Nettoyage des changements locaux pour éviter les conflits
          git checkout main
          git fetch --all
          git reset --hard origin/main

          # --- 2. FRONTEND (Angular) ---
          echo "🅰️  Mise à jour du Frontend..."
          cd frontend
          
          echo "📦 Installation des dépendances Frontend..."
          # Utilisation de install au lieu de ci + legacy-peer-deps pour gérer vos conflits de versions
          npm install --legacy-peer-deps
          
          echo "🏗️  Build de l'application Angular..."
          npm run build -- --configuration production

          # --- 3. BACKEND (Node.js) ---
          echo "🔙 Mise à jour du Backend..."
          cd ../backend
          
          echo "📦 Installation des dépendances Backend..."
          npm install --production --legacy-peer-deps

          echo "🔄 Gestion du processus PM2..."
          # Redémarre si existe, sinon le démarre. Nom du process : 'hs-backend'
          pm2 reload hs-backend || pm2 start server.js --name hs-backend

          echo "💾 Sauvegarde de la liste PM2..."
          pm2 save

          echo "✅ DÉPLOIEMENT TERMINÉ AVEC SUCCÈS ! 🎉"